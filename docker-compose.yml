version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monsoonguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monsoonguard}
      POSTGRES_DB: ${POSTGRES_DB:-monsoonguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monsoonguard -d monsoonguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-monsoonguard}:${POSTGRES_PASSWORD:-monsoonguard}@db:5432/${POSTGRES_DB:-monsoonguard}
      - ML_MODEL_PATH=/ml/models/
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
